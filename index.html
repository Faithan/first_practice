<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="bootstrap-5.3.5-dist/css/bootstrap.css">
    <script src="bootstrap-5.3.5-dist/js/bootstrap.js"></script>

    <!-- booststrap -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script> -->
</head>

<body>
    <div class="container-fluid border  p-2">
        <h1>Bootstrap Practice 1</h1>
        Hello World

        <h3 class="mt-3 text-primary">Grid Practice</h3>
        <div class="container-fluid border">
            <div class="row gap-1 ">
                <div class="col-12">col 1</div>
                <div class="col-xl-2 col-lg-2 col-md-2 col-12">col 2</div>
                <div class="col-xl col-lg col-md ">col 3</div>
                <div class="col-xl-2 col-lg-2 col-md-2 col-12">col 4</div>
                <div class="col-12">col 5</div>
            </div>


        </div>

        <h3 class="mt-3 text-primary">Button Practice</h3>
        <div class="container-fluid border">
            <button type="button" class="btn btn-primary">
                <i class="bi bi-star-fill"></i> Primary
            </button>
            <button type="button" class="btn btn-secondary">
                <i class="bi bi-gear-fill"></i> Secondary
            </button>
            <button type="button" class="btn btn-success">
                <i class="bi bi-check-circle-fill"></i> Success
            </button>
            <button type="button" class="btn btn-danger">
                <i class="bi bi-exclamation-triangle-fill"></i> Danger
            </button>
            <button type="button" class="btn btn-warning">
                <i class="bi bi-exclamation-circle-fill"></i> Warning
            </button>
            <button type="button" class="btn btn-info">
                <i class="bi bi-info-circle-fill"></i> Info
            </button>
            <button type="button" class="btn btn-light">
                <i class="bi bi-lightbulb-fill"></i> Light
            </button>
            <button type="button" class="btn btn-dark">
                <i class="bi bi-moon-fill"></i> Dark
            </button>

            <button type="button" class="btn btn-link">
                <i class="bi bi-link-45deg"></i> Link
            </button>


        </div>
        <div class="container-fluid border mt-1">
            <button type="button" class="btn btn-outline-primary">Primary</button>
            <button type="button" class="btn btn-outline-secondary">Secondary</button>
            <button type="button" class="btn btn-outline-success">Success</button>
            <button type="button" class="btn btn-outline-danger">Danger</button>
            <button type="button" class="btn btn-outline-warning">Warning</button>
            <button type="button" class="btn btn-outline-info">Info</button>
            <button type="button" class="btn btn-outline-light">Light</button>
            <button type="button" class="btn btn-outline-dark">Dark</button>
        </div>

        <style>
            body {
                background-color: #e9ecef;
                font-family: Arial, sans-serif;
            }
            [class*="container"] {
                background-color: #f8f9fa;
                padding: 20px;
                border-radius: 5px;

            }

            [class*="col"] {
                background-color: #77bafd;
                padding: 20px;
                border-radius: 5px;

            }

            h1 {
                color: #343a40;
                font-size: 2.5rem;
                margin-bottom: 20px;
            }
        </style>



    </div>
</body>


</html>
